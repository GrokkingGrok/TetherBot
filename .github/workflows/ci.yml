# Move this file to .github/workflows/ci.yml to enable GitHub Actions.
# The push credential cannot write .github/workflows. The owner runs:
#   git mv ci/workflow.yml .github/workflows/ci.yml && git commit -m 'Enable CI' && git push
name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install lint and test tools
        run: python -m pip install --upgrade pip && python -m pip install pytest ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
