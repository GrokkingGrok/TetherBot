# TetherBot example config. Copy to ~/.config/tetherbot/config.toml.
# Secrets do not belong in this file. URLs that identify a webhook slot
# belong in the secret service together with the key.

schema = "tetherbot/1"

[bridge]
# webhook-only, repo-only, or full
mode = "webhook-only"

# Queue defaults match the spec and can be lowered, not raised past 120s.
# [queue]
# coalesce_seconds = 20
# coalesce_max_seconds = 120
# min_interval_seconds = 60
# daily_cap = 30

[adapters.webhook-sender]
enabled = false

[adapters.github-poller]
enabled = false
# remote = "https://github.com/OWNER/tetherbot-data.git"
# branch = "main"
# poll_seconds = 120
# auth = "https-token"   # or ssh-deploy-key
# A file:// URL with an absolute path needs no token.
# https-token uses git-credential-tetherbot. The token is not part of
# this URL. ssh-deploy-key is accepted here and does not run git yet.

[adapters.official]
enabled = false

[sinks.legacy-todo]
enabled = false
# mode = "shadow"        # shadow or live
# todo_path = ""
# previous_unit = ""

# [bots.primary]
# webhook_slot = "primary-actions"
# display_name = "Primary"   # optional; wins over display_name in the feed
#
# A second bot is another table and its own feed file. The slug stays the id.
# [bots.notes]
# webhook_slot = "notes-actions"
# display_name = "Notes"
